name: Publish Linux x64 release assets

# Intentionally manual-only. This publishes an existing artifact and never builds.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# Extra clicks serialize; after the first succeeds, later runs become no-ops.
concurrency:
  group: trawler-linux-x64-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Attach verified Linux x64 packages to v0.5.1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: mediaheros/Trawler
      RELEASE_TAG: v0.5.1

    steps:
      - uses: actions/checkout@v4

      - name: Skip when all Linux assets are already published
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"
          body="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json body --jq '.body')"
          publish=false
          for asset in \
            Trawler_0.5.1_linux-x64.AppImage \
            Trawler_0.5.1_linux-x64.AppImage.sig \
            Trawler_0.5.1_linux-x64.deb \
            Trawler_0.5.1_linux-x64.rpm
          do
            if ! grep -Fxq "$asset" <<<"$existing"; then
              publish=true
            fi
          done
          manifest_dir="$(mktemp -d)"
          if ! gh release download "$RELEASE_TAG" \
            --pattern latest.json \
            --dir "$manifest_dir" \
            --clobber \
            --repo "$REPOSITORY"; then
            publish=true
          elif ! cmp -s docs/dl/latest.json "$manifest_dir/latest.json"; then
            publish=true
          fi
          if ! grep -Fq '### Linux x64' <<<"$body"; then
            publish=true
          fi
          echo "publish=$publish" >>"$GITHUB_OUTPUT"

      - name: Download the pinned Linux artifact
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: Trawler-linux-x64
          path: artifact
          repository: mediaheros/Trawler
          run-id: 32838854325
          github-token: ${{ github.token }}

      - name: Verify and name release assets
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'b1b8f62c175341c8c0b14c9031dc1dbce2c53790168e290756c3a66df406a4f1  artifact/appimage/Trawler_0.5.1_amd64.AppImage' | sha256sum -c -
          echo '667df3e822e69e22deb828e36ace691b8a118a257367f2277249af7d00e994a0  artifact/appimage/Trawler_0.5.1_amd64.AppImage.sig' | sha256sum -c -
          echo 'c20210b3ef09d1aeecaa5057492ca341a6807d3b37934ba85130debd7be38b1b  artifact/deb/Trawler_0.5.1_amd64.deb' | sha256sum -c -
          echo '90dbc4cc7090a3d354299e693fe1e76581bf4021692d560552f2f59f75f58a98  artifact/rpm/Trawler-0.5.1-1.x86_64.rpm' | sha256sum -c -
          mkdir release-assets
          install -m 0755 artifact/appimage/Trawler_0.5.1_amd64.AppImage release-assets/Trawler_0.5.1_linux-x64.AppImage
          install -m 0644 artifact/appimage/Trawler_0.5.1_amd64.AppImage.sig release-assets/Trawler_0.5.1_linux-x64.AppImage.sig
          install -m 0644 artifact/deb/Trawler_0.5.1_amd64.deb release-assets/Trawler_0.5.1_linux-x64.deb
          install -m 0644 artifact/rpm/Trawler-0.5.1-1.x86_64.rpm release-assets/Trawler_0.5.1_linux-x64.rpm

      - name: Publish assets and release notes
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            release-assets/Trawler_0.5.1_linux-x64.AppImage \
            release-assets/Trawler_0.5.1_linux-x64.AppImage.sig \
            release-assets/Trawler_0.5.1_linux-x64.deb \
            release-assets/Trawler_0.5.1_linux-x64.rpm \
            docs/dl/latest.json \
            --clobber \
            --repo "$REPOSITORY"
          notes=$'### Windows x64\n\nDownload `Trawler_*_x64-setup.exe`.\n\nThis build is not Authenticode-signed, so Windows SmartScreen may require **More info → Run anyway** on first launch.\n\n### Linux x64\n\nChoose the portable AppImage, Debian `.deb`, or RPM package. The AppImage supports signed in-app updates; `.deb` and `.rpm` installs update by installing the newer package.\n\nFor AppImage, run `chmod +x Trawler_*.AppImage && ./Trawler_*.AppImage`. If FUSE is unavailable, launch with `APPIMAGE_EXTRACT_AND_RUN=1`.'
          gh release edit "$RELEASE_TAG" --notes "$notes" --repo "$REPOSITORY"
