name: Audit fixes CI (temporary)

# Temporary: runs the Rust and frontend test suites on every push to the
# audit-fixes branch and publishes the full log to the audit-fixes-ci-log
# branch so it can be read without a login. Delete with the branch.
on:
  push:
    branches: [audit-fixes]

permissions:
  contents: write

concurrency:
  group: trawler-audit-fixes-ci
  cancel-in-progress: true

jobs:
  test:
    name: Clippy and tests (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run everything, keep the log
        shell: bash
        run: |
          set -o pipefail
          status=0
          {
            echo "=== npm test ==="
            npm test || status=1
            echo
            echo "=== cargo clippy --all-targets ==="
            (cd src-tauri && cargo clippy --all-targets 2>&1) || status=1
            echo
            echo "=== cargo test --all-targets ==="
            (cd src-tauri && cargo test --all-targets 2>&1) || status=1
            echo
            echo "=== RESULT: $status (0 = all green) ==="
          } 2>&1 | tee ci-log.txt
          echo "status=$status" >> "$GITHUB_ENV"

      - name: Publish the log to the audit-fixes-ci-log branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          mkdir -p /tmp/log && cp ci-log.txt /tmp/log/
          cd /tmp/log
          git init -q
          git config user.name "audit-ci"
          git config user.email "audit-ci@users.noreply.github.com"
          git checkout -q -b audit-fixes-ci-log
          echo "$sha" > COMMIT
          echo "${status:-unknown}" > STATUS
          git add .
          git commit -q -m "CI log for $sha (status ${status:-unknown})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" audit-fixes-ci-log
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fail the job if anything was red
        run: test "${status}" = "0"
