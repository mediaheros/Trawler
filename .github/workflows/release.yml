name: Windows release

# A release is built only when an explicit version tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: trawler-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Build Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Build draft Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Trawler ${{ github.ref_name }}"
          releaseBody: |
            ### Windows x64
            Download `Trawler_*_x64-setup.exe`.

            This build is not Authenticode-signed, so Windows SmartScreen may
            require **More info → Run anyway** on first launch.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: "--bundles nsis"
