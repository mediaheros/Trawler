name: Audit CI - Windows x64

# TEMPORARY: push-triggered copy of windows-x64.yml for the audit branch,
# because that workflow is dispatch-only. Delete this file before merging.
on:
  push:
    branches:
      - audit/v0.5.4-fixes

permissions:
  contents: read

concurrency:
  group: trawler-audit-windows-x64
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Test and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Build Windows x64 NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --bundles nsis --config src-tauri/tauri.windows-ci.conf.json
