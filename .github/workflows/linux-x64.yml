name: Linux x64 build

# Intentionally manual-only. Pushes, pull requests, and tags cannot start it.
on:
  workflow_dispatch:

permissions:
  contents: read

# Repeated clicks cannot create concurrent builds; only the newest run survives.
concurrency:
  group: trawler-linux-x64-build
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Build and smoke-test Linux x64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri and package verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cpio \
            dbus-x11 \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget \
            xauth \
            xvfb

      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Build AppImage, Debian, and RPM packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npm run tauri -- build --ci
          --bundles appimage,deb,rpm
          --config src-tauri/tauri.linux-ci.conf.json

      - name: Verify package structures
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          signatures=(src-tauri/target/release/bundle/appimage/*.AppImage.sig)
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          [[ ${#appimages[@]} -eq 1 ]]
          [[ ${#signatures[@]} -eq 1 ]]
          [[ ${#debs[@]} -eq 1 ]]
          [[ ${#rpms[@]} -eq 1 ]]
          appimage_file="$(file "${appimages[0]}")"
          echo "$appimage_file"
          [[ "$appimage_file" == *"ELF 64-bit"* ]]
          [[ "$appimage_file" == *"x86-64"* ]]
          dpkg-deb --info "${debs[0]}" >/dev/null
          mkdir deb-root rpm-root
          dpkg-deb --extract "${debs[0]}" deb-root
          test -x deb-root/usr/bin/trawler
          (
            cd rpm-root
            rpm2cpio "../${rpms[0]}" | cpio -idm --quiet
          )
          test -x rpm-root/usr/bin/trawler

      - name: Launch the AppImage under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [[ ${#appimages[@]} -eq 1 ]]
          chmod +x "${appimages[0]}"
          set +e
          timeout 15s dbus-run-session -- xvfb-run -a env \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            "${appimages[0]}" >appimage-smoke.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 124 && $status -ne 143 ]]; then
            cat appimage-smoke.log
            exit 1
          fi
          if grep -Eiq 'panicked at|undefined symbol|error while loading shared libraries|segmentation fault' appimage-smoke.log; then
            cat appimage-smoke.log
            exit 1
          fi

      - name: Upload Linux packages
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Trawler-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
