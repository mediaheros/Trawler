name: Windows ARM64 build

# Intentionally manual-only. Pushes, pull requests, and tags cannot start it.
on:
  workflow_dispatch:

permissions:
  contents: read

# Repeated clicks cannot create concurrent ARM64 builds; only the newest run survives.
concurrency:
  group: trawler-windows-arm64-build
  cancel-in-progress: true

jobs:
  windows-arm64:
    name: Build Windows ARM64 installer
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Select stable Rust and ARM64 target
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests on Windows ARM64
        working-directory: src-tauri
        run: cargo test --all-targets --target aarch64-pc-windows-msvc

      - name: Build Windows ARM64 NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --bundles nsis --target aarch64-pc-windows-msvc --config src-tauri/tauri.windows-ci.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Trawler-windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7
